<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Sales Tracking & Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Visible fallback instead of a silent blank page if the app fails to start
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif"><h2>App did not start</h2>' +
            '<p>Press F12 &rarr; Console and read the first red error. Also check the terminal running <code>npm run dev</code>.</p></div>';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
