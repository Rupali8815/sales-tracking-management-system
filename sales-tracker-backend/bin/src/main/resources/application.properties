# =====================================================================
# SERVER
# =====================================================================
server.port=8080
server.servlet.context-path=/

# =====================================================================
# APPLICATION
# =====================================================================
spring.application.name=sales-tracker

# =====================================================================
# DATASOURCE
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sales_tracker?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA / HIBERNATE
# =====================================================================
# schema is managed via database/schema.sql, so ddl-auto stays on validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================================
# MULTIPART / FILE UPLOAD
# =====================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================================
# APP-SPECIFIC: JWT
# =====================================================================
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
app.jwt.access-token-expiration-ms=900000
# 15 minutes
app.jwt.refresh-token-expiration-ms=604800000
# 7 days

# =====================================================================
# APP-SPECIFIC: CORS
# =====================================================================
app.cors.allowed-origins=http://localhost:3000

# =====================================================================
# SPRINGDOC / SWAGGER
# =====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================================================
# LOGGING
# =====================================================================
logging.level.com.company.salestracker=INFO
logging.level.org.springframework.security=WARN

# ---- Dev bootstrap admin (see DataInitializer) ----
app.bootstrap.admin-email=admin@company.com
app.bootstrap.admin-password=Admin@123
# set to true for ONE run to force-reset the admin password, then set back to false
app.bootstrap.reset-admin=true

# Safety net: never fail a response because Jackson meets a Hibernate lazy proxy (ByteBuddyInterceptor)
spring.jackson.serialization.fail-on-empty-beans=false
